# fly.toml app configuration file for MotionSlides Export Server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "motionslides-export"
primary_region = "lhr"

[build]
  dockerfile = "apps/export-server/Dockerfile"

[env]
  PORT = "3001"
  FRONTEND_URL = "https://motionslides.app"
  MAX_CONCURRENT_EXPORTS = "1"
  STORAGE_PROVIDER = "r2"
  R2_BUCKET_NAME = "motionslides"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

